name: QuinchosApp
options:
  bundleIdPrefix: com.quinchos
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 1
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: L2V2C22VFC

targets:
  QuinchosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - QuinchosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quinchos.app
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: L2V2C22VFC
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Necesitamos tu ubicación para mostrarte quinchos cercanos"
        INFOPLIST_KEY_NSCameraUsageDescription: "Permite tomar fotos para tus reseñas"
