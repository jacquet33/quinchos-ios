name: QuinchosApp
options:
  bundleIdPrefix: com.quinchos
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: 2
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: L2V2C22VFC

targets:
  QuinchosApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - QuinchosApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.quinchos.app
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: L2V2C22VFC
        CODE_SIGN_ENTITLEMENTS: QuinchosApp/QuinchosApp.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Necesitamos tu ubicación para mostrarte quinchos cercanos"
        INFOPLIST_KEY_NSCameraUsageDescription: "Para tomar fotos de tu espacio y de tu perfil"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Para elegir fotos de tu espacio y de tu perfil"
        INFOPLIST_KEY_UIBackgroundModes: "remote-notification"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: QuinchosApp/Info.plist
      properties:
        CFBundleDisplayName: QuinchosApp
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "2"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - remote-notification
        NSLocationWhenInUseUsageDescription: "Necesitamos tu ubicación para mostrarte quinchos cercanos"
        NSCameraUsageDescription: "Para tomar fotos de tu espacio y de tu perfil"
        NSPhotoLibraryUsageDescription: "Para elegir fotos de tu espacio y de tu perfil"
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: google-oauth
            CFBundleURLSchemes:
              - com.googleusercontent.apps.640270129167-k2u215i6t80f29ioo4g1l88339b751k2
