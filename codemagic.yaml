workflows:
  quinchos-ios:
    name: QuinchosApp iOS
    max_build_duration: 30
    instance_type: mac_mini_m2
    
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.quinchos.app"
        TEAM_ID: "L2V2C22VFC"
    
    integrations:
      app_store_connect: IT rispy
    
    scripts:
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          if [ -f "project.yml" ]; then
            brew install xcodegen
            xcodegen generate
          fi

      - name: Build
        script: |
          cd $CM_BUILD_DIR
          xcode-project build-ipa \
            --project "QuinchosApp.xcodeproj" \
            --scheme "QuinchosApp" \
            --config "Release"
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      
      email:
        recipients:
          - alejandrojacquet@gmail.com
        notify:
          success: true
          failure: true
