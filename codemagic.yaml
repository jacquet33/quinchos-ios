workflows:
  quinchos-ios:
    name: QuinchosApp iOS
    max_build_duration: 30
    instance_type: mac_mini_m2
    
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.quinchos.app"
        TEAM_ID: "L2V2C22VFC"
      groups:
        - a
    
    integrations:
      app_store_connect: IT rispy
    
    scripts:
      - name: Generate Xcode project
        script: |
          cd $CM_BUILD_DIR
          brew install xcodegen
          xcodegen generate

      - name: Increment build number
        script: |
          cd $CM_BUILD_DIR
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "0")
          NEXT=$((LATEST + 1))
          agvtool new-version -all $NEXT
          echo "Build number: $NEXT"

      - name: Fetch signing files
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Set up keychain
        script: |
          keychain initialize
          keychain add-certificates

      - name: Set up code signing
        script: |
          xcode-project use-profiles

      - name: Build
        script: |
          cd $CM_BUILD_DIR
          LATEST=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" || echo "1")
          NEXT=$((LATEST + 1))
          echo "Building with version $NEXT"
          xcode-project build-ipa \
            --project "QuinchosApp.xcodeproj" \
            --scheme "QuinchosApp" \
            --build-arguments="CURRENT_PROJECT_VERSION=$NEXT"
    
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      
      email:
        recipients:
          - alejandrojacquet@gmail.com
        notify:
          success: true
          failure: true
